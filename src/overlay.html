<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verba</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>

<!-- A glass capsule that drops from the top edge, with a full-spectrum wave
     inside it that answers the voice. It narrows to a shimmering label while
     the text is being worked out, and opens into a panel for the result.
     One element changes shape between states and the CSS owns the geometry. -->
<div id="stage-orb" class="stage s-idle">
  <div id="orb-bloom"></div>
  <div id="orb" class="s-idle">
    <!-- The desktop behind the window, aligned to it and magnified slightly,
         so the capsule reads as a lens over what is underneath. A transparent
         window has nothing for backdrop-filter to sample, so it is captured. -->
    <canvas id="orb-behind"></canvas>
    <div id="orb-head">
      <!-- Seven ribbons, all filled with the same violet-to-red gradient along
           their length. Blending them instead (screen, multiply) washed the
           overlap out to white on dark glass and to black on light, so the
           colours are fixed and the ribbons differ only in shape and opacity.
           The stop colours come from CSS so each theme can use its own set. -->
      <svg id="orb-wave" viewBox="0 0 1000 160" preserveAspectRatio="none">
        <defs>
          <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
            <stop offset="0"></stop><stop offset=".1667"></stop><stop offset=".3333"></stop>
            <stop offset=".5"></stop><stop offset=".6667"></stop><stop offset=".8333"></stop>
            <stop offset="1"></stop>
          </linearGradient>
        </defs>
        <g id="orb-ribbons">
          <path></path><path></path><path></path><path></path>
          <path></path><path></path><path></path>
        </g>
      </svg>
      <span id="orb-label">Listening</span>
      <span id="orb-time">0:00</span>
    </div>
    <div id="orb-text"><div id="orb-line"></div></div>
  </div>
</div>

<script src="wave.js"></script>
</body>
</html>

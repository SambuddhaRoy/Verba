<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verba</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>

<!-- Fractal-noise displacement for the glow. Deforms the halo silhouette so the
     glow is never a uniform band: it thickens, thins and breaks up. Both the
     displacement amount and the noise scale are driven from audio, so the
     texture churns with speech rather than on a fixed loop. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="glowNoise" x="-45%" y="-45%" width="190%" height="190%"
          color-interpolation-filters="sRGB">
    <feTurbulence id="gn-turb" type="fractalNoise" baseFrequency="0.013 0.019"
                  numOctaves="3" seed="11" result="n"></feTurbulence>
    <feDisplacementMap id="gn-disp" in="SourceGraphic" in2="n" scale="22"
                       xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
</defs></svg>

<!-- Two visual treatments, one shown at a time. Switched from Settings. -->

<div id="stage-ribbons" class="stage">
  <div id="glass">
    <!-- Soft field, then the frosting that blurs it. backdrop-filter samples
         what is painted below it in the same stacking context, so the blur
         needs something of its own to work on — a transparent overlay window
         has no desktop behind it to sample. -->
    <div id="field"></div>
    <div id="frost"></div>

    <div id="wave">
      <svg viewBox="0 0 1000 160" preserveAspectRatio="none">
        <defs>
          <filter id="bloom" x="-30%" y="-60%" width="160%" height="220%">
            <feGaussianBlur stdDeviation="11"></feGaussianBlur>
          </filter>
        </defs>
        <!-- The bloom is the same geometry re-drawn through a blur, exactly as
             the design specifies. Cheaper and more faithful than a second pass. -->
        <use href="#ribbons" filter="url(#bloom)" opacity=".78"></use>
        <g id="ribbons" style="isolation:isolate">
          <path fill="#6E7BFF" opacity=".78"></path>
          <path fill="#FF4E9A" opacity=".76"></path>
          <path fill="#A88BFF" opacity=".72"></path>
          <path fill="#FFB070" opacity=".62"></path>
          <path fill="#59E7C4" opacity=".50"></path>
          <path fill="#FF9AD5" opacity=".55"></path>
          <path fill="#FFFFFF" opacity=".90"></path>
        </g>
      </svg>
      <div id="blend"></div>
    </div>

    <div id="body">
      <div id="inner">
        <div id="meta">
          <span id="status">LISTENING</span>
          <span id="timer">0:00</span>
          <span id="engine">SMALL.EN · LOCAL</span>
        </div>
        <div id="line"></div>
      </div>
    </div>
  </div>
</div>

<div id="stage-glow" class="stage" hidden>
  <div id="glow-shell">
    <!-- Three concentric rings hugging the box outline, each a conic gradient
         masked to its border band and blurred. They live behind the box and
         inside the page, so the box's backdrop-filter has real content to
         sample — this treatment never depends on the desktop showing through.
         The rings are the audio-reactive element; the box interior is text. -->
    <div id="aura">
      <div class="halo h1"></div>
      <div class="halo h2"></div>
      <div class="halo h3"></div>
    </div>
    <div id="glow-box">
      <div id="glow-meta">
        <span id="g-status">LISTENING</span>
        <span id="g-timer">0:00</span>
        <span id="g-engine">LOCAL</span>
      </div>
      <div id="g-line"></div>
    </div>
  </div>
</div>

<script src="wave.js"></script>
</body>
</html>

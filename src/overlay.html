<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Verba</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>

<!-- Two visual treatments, one shown at a time. Switched from Settings. -->

<div id="stage-ribbons" class="stage">
  <div id="glass">
    <div id="rim"></div>

    <div id="wave">
      <svg viewBox="0 0 1000 160" preserveAspectRatio="none">
        <defs>
          <filter id="bloom" x="-30%" y="-60%" width="160%" height="220%">
            <feGaussianBlur stdDeviation="11"></feGaussianBlur>
          </filter>
        </defs>
        <!-- The bloom is the same geometry re-drawn through a blur, exactly as
             the design specifies. Cheaper and more faithful than a second pass. -->
        <use href="#ribbons" filter="url(#bloom)" opacity=".78"></use>
        <g id="ribbons" style="isolation:isolate">
          <path fill="#6E7BFF" opacity=".78"></path>
          <path fill="#FF4E9A" opacity=".76"></path>
          <path fill="#A88BFF" opacity=".72"></path>
          <path fill="#FFB070" opacity=".62"></path>
          <path fill="#59E7C4" opacity=".50"></path>
          <path fill="#FF9AD5" opacity=".55"></path>
          <path fill="#FFFFFF" opacity=".90"></path>
        </g>
      </svg>
      <div id="blend"></div>
    </div>

    <div id="body">
      <div id="inner">
        <div id="meta">
          <span id="status">LISTENING</span>
          <span id="timer">0:00</span>
          <span id="engine">SMALL.EN · LOCAL</span>
        </div>
        <div id="line"></div>
      </div>
    </div>
  </div>
</div>

<div id="stage-glow" class="stage" hidden>
  <div id="glow-shell">
    <!-- Aura sits behind the box. Because it lives in the page, the box's
         backdrop-filter has real content to sample — this treatment does not
         depend on the desktop showing through at all. -->
    <div id="aura">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div id="glow-box">
      <div id="glow-meta">
        <span id="g-status">LISTENING</span>
        <span id="g-timer">0:00</span>
        <span id="g-engine">SMALL.EN · LOCAL</span>
      </div>
      <div id="g-bars"></div>
      <div id="g-line"></div>
    </div>
  </div>
</div>

<script src="wave.js"></script>
</body>
</html>

[package]
name = "verba"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.1"
num_cpus = "1.17.0"
rubato = "0.16"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = ["tray-icon"] }
whisper-rs = "0.16.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Console"] }

[build-dependencies]
tauri-build = "2.6.3"
